<text x="611" y="94" font-family="Arial, sans-serif" font-size="10" font-weight="700">USB power adapter</text>
<text x="36" y="469" font-family="Arial, sans-serif" font-size="10" font-weight="700">OEM controller TX must be disconnected from ERV RX before connecting the ESP transmit path.</text>
<text x="36" y="489" font-family="Arial, sans-serif" font-size="10" font-weight="400">R1/R2 divider + nominal 45k internal pull-down: about 2.74-2.95 V at TP1 over the measured range.</text>
<text x="36" y="507" font-family="Arial, sans-serif" font-size="10" font-weight="400">Use rx_pull_down: true for this circuit. Without internal pull: about 2.83-3.05 V. Measure your unit.</text>
<text x="36" y="525" font-family="Arial, sans-serif" font-size="10" font-weight="400">R1/R2/R3: 1%, 1/4 W. Dots join wires. TX/RX labels are from the ERV perspective.</text>
<text x="36" y="543" font-family="Arial, sans-serif" font-size="10" font-weight="400">3.3 V ESP transmit worked on the tested unit. R3 is not a level shifter. Never connect ERV 12 V to ESP.</text>
<text x="36" y="561" font-family="Arial, sans-serif" font-size="10" font-weight="400">4800 baud / 8 data / EVEN parity / 1 stop / RX and TX inverted. Verify voltage and direction first.</text>
<line x1="36" y1="578" x2="756" y2="578" stroke="black" stroke-width="1.2"/>
